name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          else
            echo "sdkmanager not found; skipping explicit license acceptance"
          fi

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew --no-daemon test

      - name: Upload unit test reports on failure
        if: ${{ failure() && steps.unit_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          retention-days: 14
          if-no-files-found: warn

      - name: Run Android Lint
        id: lint
        if: ${{ always() }}
        run: ./gradlew --no-daemon lint

      - name: Upload lint reports on failure
        if: ${{ failure() && steps.lint.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results*
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
            app/build/reports/lint-results*.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Assemble debug APK
        id: assemble_debug
        if: ${{ always() }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: ${{ always() && steps.assemble_debug.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
